name: Build master curriculum map v0.2

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-curriculum-map-v02.yml"
      - "curriculum/master-map/scripts/build_v02.py"
      - "curriculum/master-map/reviews/dependency-review-batch-01.json"

permissions:
  contents: write

jobs:
  build-audit-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install workbook library
        run: python -m pip install --disable-pip-version-check openpyxl
      - name: Build and validate v0.2 workbook
        run: python curriculum/master-map/scripts/build_v02.py
      - name: Commit generated workbook and audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add curriculum/master-map/Mathematics_Understood_Master_Curriculum_Map_v0.2.xlsx
          git add curriculum/master-map/AUDIT_REPORT_v0.2.md
          git add curriculum/master-map/README.md
          git add README.md
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "curriculum: add audited master map v0.2"
          git push origin HEAD:main
