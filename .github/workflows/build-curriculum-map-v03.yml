name: Build master curriculum map v0.3

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-curriculum-map-v03.yml"
      - "curriculum/master-map/scripts/build_v03.py"
      - "curriculum/master-map/reviews/complex-number-split-review-v03.json"
      - "curriculum/master-map/Mathematics_Understood_Master_Curriculum_Map_v0.2.xlsx"

permissions:
  contents: write

concurrency:
  group: curriculum-map-v03-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-audit-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install workbook library
        run: python -m pip install --disable-pip-version-check openpyxl
      - name: Build and validate v0.3 workbook
        run: python curriculum/master-map/scripts/build_v03.py
      - name: Commit generated workbook and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add curriculum/master-map/Mathematics_Understood_Master_Curriculum_Map_v0.3.xlsx
          git add curriculum/master-map/AUDIT_REPORT_v0.3.md
          git add curriculum/master-map/README.md
          git add README.md
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "curriculum: publish v0.3 complex-number scope split"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
